plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.0'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'com.jhuanglululu'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        name = 'codemc'
        url = uri('https://repo.codemc.io/repository/maven-releases/')
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
    // The WASM interpreter + task runtime, built from the GitHub repo by the source
    // dependency in settings.gradle (tracks main; a pushed engine commit is picked up on
    // --refresh-dependencies). Shaded into the plugin jar unrelocated: our own namespace.
    implementation('com.jhuanglululu:wasmachine') { version { branch = 'main' } }
    // Shaded + relocated (see shadowJar) so the jar is self-contained.
    implementation 'com.github.retrooper:packetevents-spigot:2.13.0'
    // config.toml only (read-only); data lives in JSON/JSONL parsed with the Gson that
    // paper-api already puts on the classpath, so no JSON library is bundled.
    implementation('org.tomlj:tomlj:1.1.1') {
        // Nullness annotations only; nothing reads them at run time, and unexcluded they would be
        // a third-party namespace in the shaded jar that no relocation of ours covers.
        exclude group: 'org.checkerframework', module: 'checker-qual'
    }
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.2'
    // Paper is compileOnly for the plugin, but the tests need the real MiniMessage it bundles to
    // hold PaperContentValidator to the same parser the renderer will use at run time.
    testImplementation 'io.papermc.paper:paper-api:26.2.build.+'
    // The hand-rolled wasm emitters and the shared runtime driver live with the engine.
    testImplementation(testFixtures('com.jhuanglululu:wasmachine')) { version { branch = 'main' } }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Werror'
}

processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier = 'all'
    // Relocate bundled libraries out of their own namespaces so a server that also
    // ships PacketEvents / tomlj never clashes with our shaded copies.
    def libs = 'com.jhuanglululu.billboard.libs'
    relocate 'com.github.retrooper.packetevents', "${libs}.packetevents.api"
    relocate 'io.github.retrooper.packetevents', "${libs}.packetevents.spigot"
    relocate 'org.tomlj', "${libs}.tomlj"
    // tomlj's generated parser drags in the ANTLR runtime; unrelocated it would be the
    // one unshaded namespace in the jar.
    relocate 'org.antlr', "${libs}.antlr"
}

runServer {
    minecraftVersion '26.2'
}
